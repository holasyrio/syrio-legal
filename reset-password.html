<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Restablecer contraseña · Syrio</title>
    <style>
        :root {
            --primary: #CF6637;
            --primaryDark: #A84E22;
            --primaryLight: #FDEFEA;
            --bg: #F8F5F0;
            --surface: #FFFFFF;
            --textPrimary: #1F1610;
            --textSecondary: #7A6A5E;
            --border: #E5DDD4;
            --success: #3E8A5F;
            --error: #E04040;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--textPrimary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .logo {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .brand {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .tagline {
            font-size: 13px;
            color: var(--textSecondary);
            margin-bottom: 24px;
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            color: var(--textPrimary);
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--textSecondary);
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--textPrimary);
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 16px;
            font-size: 15px;
            background: var(--bg);
            color: var(--textPrimary);
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
        .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primaryDark); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .message {
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .message.error {
            display: block;
            background: #FEF0F0;
            color: var(--error);
            border: 1px solid #FDD;
        }
        .message.success {
            display: block;
            background: #E8F5EE;
            color: var(--success);
            border: 1px solid #D4EDE0;
        }
        .success-box { display: none; }
        .success-box.show { display: block; }
        .form-box.show { display: block; }
        .form-box { display: none; }
        .success-icon { font-size: 56px; margin-bottom: 12px; }
        .app-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }
        .app-link {
            background: var(--primaryLight);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🐾</div>
        <div class="brand">Syrio</div>
        <div class="tagline">Tu tranquilidad tiene nombre de estrella</div>

        <!-- Formulario de nueva contraseña -->
        <div id="formBox" class="form-box">
            <div class="title">Nueva contraseña</div>
            <div class="subtitle">Elige una contraseña segura para tu cuenta.</div>
            <div class="input-group">
                <label>Nueva contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password">
            </div>
            <div id="message" class="message"></div>
            <button class="btn" id="submitBtn" onclick="updatePassword()">Guardar contraseña</button>
        </div>

        <!-- Éxito -->
        <div id="successBox" class="success-box">
            <div class="success-icon">✅</div>
            <div class="title">¡Contraseña actualizada!</div>
            <div class="subtitle">Tu contraseña se ha cambiado correctamente. Vuelve a la app de Syrio para iniciar sesión con tu nueva contraseña.</div>
            <div class="app-links">
                <a href="syrio://" class="app-link">Abrir Syrio</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuración de Supabase (claves públicas, seguras para frontend)
        const SUPABASE_URL = 'https://ffverpxoeybhavtbultl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdmVycHhvZXliaGF2dGJ1bHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk3NjY0MDAsImV4cCI6MjA1NTM0MjQwMH0.ANuMTQHYKBdJmFxRJmTlYqxGJcBUtOLwyGKGNFDXqXg';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const formBox = document.getElementById('formBox');
        const successBox = document.getElementById('successBox');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        // Detectar si estamos en el flujo de recuperación (hash con type=recovery)
        const hash = window.location.hash;
        const params = new URLSearchParams(hash.replace('#', ''));
        const type = params.get('type');
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');

        if (type === 'recovery' && accessToken) {
            // Establecer la sesión con los tokens del link
            supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken || '',
            }).then(({ error }) => {
                if (error) {
                    showMessage('El enlace ha expirado o no es válido. Solicita uno nuevo desde la app.', 'error');
                } else {
                    formBox.classList.add('show');
                }
            });
        } else if (type === 'signup') {
            // Flujo de confirmación de email tras registro
            supabase.auth.verifyOtp({
                token_hash: params.get('token_hash') || '',
                type: 'signup',
            }).then(({ error }) => {
                if (error) {
                    showMessage('El enlace de confirmación ha expirado. Regístrate de nuevo desde la app.', 'error');
                } else {
                    successBox.classList.add('show');
                }
            });
        } else {
            showMessage('Enlace no válido. Usa la app de Syrio para solicitar un nuevo enlace de recuperación.', 'error');
        }

        async function updatePassword() {
            const password = document.getElementById('password').value;
            if (password.length < 8) {
                showMessage('La contraseña debe tener al menos 8 caracteres.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            const { error } = await supabase.auth.updateUser({ password });

            if (error) {
                showMessage(error.message || 'No se pudo actualizar la contraseña.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar contraseña';
            } else {
                formBox.classList.remove('show');
                successBox.classList.add('show');
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }
    </script>
</body>
</html>
